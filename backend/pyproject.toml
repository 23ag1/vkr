[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "alembic/versions"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["openai.*", "pgvector.*", "passlib.*", "jose.*"]
ignore_missing_imports = true
